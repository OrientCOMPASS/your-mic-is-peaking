name: Build & Release

# 操作手册：
#   * push 到 main / dev（任何提交，含直接改 plugin.json 版本号）→
#     仅自动构建 development build：三平台矩阵编译 + 单测，产物作为
#     Actions artifact（your-mic-is-peaking-development，三库单包目录），
#     **绝不创建 release / tag**。
#   * macOS 产物为 arm64 + x86_64 的 universal dylib（lipo 合并，单文件
#     双架构，宿主按 entry 基础名加载时两种 Mac 通吃）。
#   * 发 release：Actions 页面 → Run workflow（workflow_dispatch），
#     可选 bump 档位（none/patch/minor/major，默认 none = 用 main 上
#     plugin.json 的当前版本）。流程：三平台构建 → 打包 → 打 tag v<ver> →
#     创建 Release（资产：plugin.zip 主包（固定名，不带版本号）+ plugin.json
#     （与 zip 内 manifest 同一份，供手动市场 PR 与更新检查）；plugin.json 的
#     downloadUrl 在仓库 manifest 里固定指向 releases/latest/download/plugin.zip，
#     CI 只校验不回写）。
#     若选择 bump 档位，会把新版本号回提交到 main（提交信息带 [skip ci]）。
#   * 同一版本重复发 release 会直接失败并提示（tag 已存在），防止误覆盖。
#   * 提交信息含 [skip ci] → 整个 workflow 跳过。
#   * 无 pull_request 触发器：PR 不跑 CI，合并进 main 后按 push 规则出 dev 构建。

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release 版本档位：none = 使用 main 上 plugin.json 当前版本"
        type: choice
        default: none
        options: [none, patch, minor, major]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x86_64-msvc, os: windows-latest, artifact: your_mic_is_peaking.dll }
          - { label: linux-x86_64, os: ubuntu-latest, artifact: your_mic_is_peaking.so }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: 安装 Rust 工具链（原生）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 单元测试
        run: cargo test --release

      - name: Release 构建
        run: cargo build --release

      - name: 归一化产物名（去 lib 前缀，宿主按平台补后缀）
        shell: bash
        run: |
          mkdir -p stage
          case "${{ matrix.artifact }}" in
            your_mic_is_peaking.so) cp target/release/libyour_mic_is_peaking.so stage/your_mic_is_peaking.so ;;
            *)                      cp target/release/${{ matrix.artifact }} stage/ ;;
          esac
          ls -la stage/

      - name: 上传平台产物
        uses: actions/upload-artifact@v7
        with:
          # 默认 zip 归档 + 显式名字 + 单文件 path：action 间传递走最标准路径
          name: lib-${{ matrix.label }}
          path: stage/${{ matrix.artifact }}

  # macOS：同一 dylib 内含 arm64（Apple Silicon）+ x86_64（Intel Mac）两个切片，
  # lipo 合并为 universal binary。宿主 entry 按平台补 .dylib 后缀即可两种 Mac 通吃。
  build-macos:
    name: 构建 macos-universal（arm64 + x86_64）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: 安装 Rust 工具链 + 双架构目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 单元测试（宿主架构）
        run: cargo test --release

      - name: Release 构建（arm64 + x86_64）
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: lipo 合并为 universal dylib
        run: |
          mkdir -p stage
          lipo -create \
            target/aarch64-apple-darwin/release/libyour_mic_is_peaking.dylib \
            target/x86_64-apple-darwin/release/libyour_mic_is_peaking.dylib \
            -output stage/your_mic_is_peaking.dylib
          lipo -info stage/your_mic_is_peaking.dylib
          # 双架构切片缺一不可
          lipo -archs stage/your_mic_is_peaking.dylib | grep -q arm64
          lipo -archs stage/your_mic_is_peaking.dylib | grep -q x86_64
          ls -la stage/

      - name: 上传平台产物
        uses: actions/upload-artifact@v7
        with:
          name: lib-macos-universal
          path: stage/your_mic_is_peaking.dylib

  dev-package:
    name: development 包（仅 push）
    if: github.event_name == 'push'
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      # GitHub 产物存储偶发瞬时故障（blob 下载重试耗尽），加一层工作流级重试
      - name: 下载三平台产物
        uses: actions/download-artifact@v7
        with:
          pattern: lib-*
          path: libs
          merge-multiple: true

      - name: 扁平化产物（兼容 artifact 任意目录层级）
        run: |
          mkdir -p libs_flat
          find libs -type f | while read -r f; do cp "$f" "libs_flat/$(basename "$f")"; done
          ls -la libs_flat/
          test -f libs_flat/your_mic_is_peaking.dll
          test -f libs_flat/your_mic_is_peaking.so
          test -f libs_flat/your_mic_is_peaking.dylib

      - name: 组装插件包目录（根即 plugin.json，可直接安装/导入）
        run: |
          mkdir -p stage
          cp plugin.json panel.html README.md LICENSE stage/
          cp libs_flat/your_mic_is_peaking.dll libs_flat/your_mic_is_peaking.so libs_flat/your_mic_is_peaking.dylib stage/
          ls -la stage/

      # artifact zip 的根即包内容（upload-artifact 会剥离公共父目录），
      # 用户下载该 artifact 后无需解套、直接解压安装或应用内导入
      - name: 上传 development artifact
        uses: actions/upload-artifact@v7
        with:
          name: your-mic-is-peaking-development
          path: stage

  release:
    name: 手动发布 Release
    if: github.event_name == 'workflow_dispatch'
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # GitHub 产物存储偶发瞬时故障（blob 下载重试耗尽），加一层工作流级重试
      - name: 下载三平台产物
        uses: actions/download-artifact@v7
        with:
          pattern: lib-*
          path: libs
          merge-multiple: true

      - name: 决定版本号（bump 档位 / 防重复）
        id: ver
        run: |
          python3 - <<'PY'
          import json, os
          p = 'plugin.json'
          m = json.load(open(p))
          maj, min_, pat = [int(x) for x in m['version'].split('.')[:3]]
          bump = os.environ['BUMP']
          if bump == 'patch':
              pat += 1
          elif bump == 'minor':
              min_ += 1; pat = 0
          elif bump == 'major':
              maj += 1; min_ = 0; pat = 0
          ver = f"{maj}.{min_}.{pat}"
          m['version'] = ver
          json.dump(m, open(p, 'w'), ensure_ascii=False, indent=2)
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f"version={ver}\n")
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f"bumped={'true' if bump != 'none' else 'false'}\n")
          print("release version:", ver, f"(bump={bump})")
          PY
        env:
          BUMP: ${{ github.event.inputs.bump }}

      - name: 防止重复发布同版本
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::release v${{ steps.ver.outputs.version }} 已存在；请在 main 修改 plugin.json 版本或选择 bump 档位"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 扁平化产物（兼容 artifact 任意目录层级）
        run: |
          mkdir -p libs_flat
          find libs -type f | while read -r f; do cp "$f" "libs_flat/$(basename "$f")"; done
          ls -la libs_flat/
          test -f libs_flat/your_mic_is_peaking.dll
          test -f libs_flat/your_mic_is_peaking.so
          test -f libs_flat/your_mic_is_peaking.dylib

      - name: 组装发布包（plugin.json 全通道同一份，downloadUrl 固定指向 latest）
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # downloadUrl 不按版本回写：仓库 plugin.json 固定指向
          # releases/latest/download/plugin.zip ⇒ zip 内 manifest == release 的
          # plugin.json 资产 == 手动市场 PR 所用文件，三者同一份
          python3 - "$VER" <<'PY'
          import json, sys
          ver = sys.argv[1]
          expect = "https://github.com/OrientCOMPASS/your-mic-is-peaking/releases/latest/download/plugin.zip"
          m = json.load(open('plugin.json'))
          assert m['version'] == ver, f"manifest version {m['version']} != {ver}"
          assert m.get('downloadUrl') == expect, \
              f"plugin.json 的 downloadUrl 应为 {expect}，实际为 {m.get('downloadUrl')!r}"
          PY
          mkdir -p stage dist
          cp plugin.json panel.html README.md LICENSE stage/
          cp libs_flat/your_mic_is_peaking.dll libs_flat/your_mic_is_peaking.so libs_flat/your_mic_is_peaking.dylib stage/
          (cd stage && zip -q -r ../dist/plugin.zip .)
          ls -la dist/

      - name: 生成变更日志（自上一个 tag）
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST" ]; then git log --oneline "$LAST..HEAD" > /tmp/notes.md; else git log --oneline -20 > /tmp/notes.md; fi
          echo "" >> /tmp/notes.md
          echo "三平台单包：windows x86_64 (MSVC) / linux x86_64 / macos universal (arm64 + x86_64)。主包固定名 plugin.zip（不带版本号），更新/下载统一走 releases/latest/download/plugin.zip。release 的 plugin.json 资产可直接用于向 MicYou-Plugins 提手动市场 PR。" >> /tmp/notes.md

      - name: 打 tag 并发布 Release
        run: |
          VER="${{ steps.ver.outputs.version }}"
          git config user.name "OrientCOMPASS"
          git config user.email "316423573+OrientCOMPASS@users.noreply.github.com"
          git tag "v${VER}"
          git push origin "v${VER}"
          gh release create "v${VER}" dist/plugin.zip plugin.json \
            --title "v${VER}" --notes-file /tmp/notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: bump 回提交到 main（[skip ci]）
        if: steps.ver.outputs.bumped == 'true'
        run: |
          git config user.name "OrientCOMPASS"
          git config user.email "316423573+OrientCOMPASS@users.noreply.github.com"
          git add plugin.json
          git commit -m "chore(release): bump version to ${{ steps.ver.outputs.version }} [skip ci]"
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ github.token }}
